name = "han-history-portal"
main = "dist/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
minify = true

# 默认基础配置（可在 Cloudflare 控制台或通过 KV 动态覆盖）
[vars]
# 用户唯一标识符（可在 /admin 管理控制台或此处配置）
DEFAULT_UUID = "d342d11e-d424-4583-b36e-524ab1f0afa4"

# 默认实时数据流路径（支持在 /admin 中动态更新与混淆）
DEFAULT_DATA_PATH = "/api-data-sync"

# 控制台路径与登录密码
ADMIN_PATH = "/admin"
ADMIN_PASSWORD = "yangjie1991!"

# 上游中继网关（留空代表直连，支持 SOCKS5 / HTTP 格式上游住宅网络节点）
DEFAULT_UPSTREAM_GATEWAY = ""

# 优选 CDN 域名与节点列表（英文逗号或换行分隔）
DEFAULT_CLEAN_IPS = "cloudflare.com,cf.090227.xyz,visa.cn,icook.hk"

# 节点标识前缀
DEFAULT_NODE_TAG = "Edge-Gateway-Node"

# 异常时是否启用直连回退机制（true / false）
ENABLE_DIRECT_FALLBACK = "true"

# Cloudflare KV 命名空间绑定（用于持久化存储控制台数据）
# 首次使用可执行: npx wrangler kv namespace create CONFIG_KV
# 并将生成的 id 填入下方
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "dcbd8210dc4549628f92ec48b3dafacd"
